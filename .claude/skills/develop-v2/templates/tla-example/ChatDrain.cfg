\* Guard kept: send waits while a cancelled process drains. Expected: no error.
\* Small constants (3 questions, 4 processes); run with --allow-deadlock.
CONSTANTS Jobs = {1, 2, 3}
          MaxProcs = 4
          None = None
          GuardDraining = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK WaitingHasDrain OneWriterUnlessKilled
PROPERTIES WaitingEventuallyLeaves
